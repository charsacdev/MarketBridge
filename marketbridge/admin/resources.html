<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources — MarketBridge Admin</title>
<meta name="theme-color" content="#0A0E12">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script>(function(){try{var t=localStorage.getItem('mb.theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body data-shell="admin" data-nav="resources" data-root="../">

<div class="admin">
  <div data-render="admin-rail"></div>
  <div class="admin-main">
    <header class="admin-topbar">
      <button class="icon-btn admin-burger" id="adminBurger" aria-label="Menu">
        <span data-icon="menu"></span></button>
      
      <div class="grow">
        <h1 id="pageTitle">Resources</h1>
        <div class="sub" id="pageSub">Courses, guides, videos, webinars and mentorship</div>
      </div>
      <button class="theme-toggle none" data-theme-toggle aria-label="Switch theme"></button>
      <a class="btn btn-primary btn-sm none" href="resource-edit.html"><span data-icon="plus"></span> New resource</a>
    </header>
    <main class="admin-body">
      
      <div id="stats"></div>
      <div id="table"></div>
    </main>
  </div>
</div>

<div class="slideover-scrim" id="soScrim"></div>
<aside class="slideover" id="slideover" role="dialog" aria-modal="true" aria-label="Details">
  <div class="slideover-head">
    <h2 class="t-h3" id="soTitle">Details</h2>
    <button class="drawer-close" id="soClose" aria-label="Close"><span data-icon="close"></span></button>
  </div>
  <div class="slideover-body" id="soBody"></div>
</aside>

<script src="../assets/js/core/icons.js"></script>
<script src="../assets/js/core/util.js"></script>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/collection.js"></script>
<script src="../assets/js/core/uploads.js"></script>
<script src="../assets/js/core/charts.js"></script>
<script src="../assets/js/core/ws.js"></script>
<script src="../assets/js/components/cards.js"></script>
<script src="../assets/js/components/datatable.js"></script>
<script src="../assets/js/core/shell.js"></script>
<script>

  function statusBadge(s) {
    var map = {
      active:'badge-active', approved:'badge-active', completed:'badge-active',
      published:'badge-active', resolved:'badge-active', verified:'badge-active', free:'badge-active',
      pending:'badge-warn', pending_approval:'badge-warn', under_review:'badge-warn',
      scheduled:'badge-warn', redirected:'badge-warn', flagged:'badge-warn', paid:'badge-info',
      draft:'badge-neutral', inactive:'badge-neutral', expired:'badge-neutral', abandoned:'badge-neutral',
      banned:'badge-lost', rejected:'badge-lost', failed:'badge-lost', blocked:'badge-lost', hidden:'badge-lost'
    };
    return '<span class="badge ' + (map[s] || 'badge-neutral') + '">' +
      String(s).replace(/_/g, ' ') + '</span>';
  }
  function userCell(name, handle, href) {
    var inner = '<div class="cell-user">' + MB.avatar({ username: name }, 'avatar-sm') +
      '<div><div class="n">' + MB.esc(name) + '</div>' +
      (handle ? '<div class="h">' + MB.esc(handle) + '</div>' : '') + '</div></div>';
    return href ? '<a class="cell-link" href="' + href + '">' + inner + '</a>' : inner;
  }
  function acts(extra) {
    return '<div class="row-actions">' + (extra || '') +
      '<button class="row-action" aria-label="More">' + MB.icon('more', 15) + '</button></div>';
  }
  function row(k, v, sub) {
    return '<div class="info-row"><span class="ir-k">' + MB.esc(k) + '</span>' +
      '<span class="ir-v">' + v + (sub ? '<span class="sub">' + MB.esc(sub) + '</span>' : '') + '</span></div>';
  }
  function statSlider(host, title, cards) {
    var el = MB.$(host); if (!el) { return; }
    el.innerHTML =
      '<div class="statslider"><div class="statslider-head"><h2>' + MB.esc(title) + '</h2>' +
        '<div class="statslider-nav">' +
          '<button data-sl="prev" aria-label="Scroll left">' + MB.icon('chevleft', 15) + '</button>' +
          '<button data-sl="next" aria-label="Scroll right">' + MB.icon('chevright', 15) + '</button>' +
        '</div></div><div class="statslider-track">' + cards.map(function (c) {
          return '<div class="stat-card' + (c.tone ? ' is-' + c.tone : '') + '">' +
            '<div class="sc-k">' + MB.esc(c.k) + '</div><div class="sc-v">' + c.v + '</div>' +
            (c.d !== undefined ? '<div class="sc-d ' + (c.d >= 0 ? 'c-up' : 'c-down') + '">' +
              MB.icon(c.d >= 0 ? 'trendup' : 'trenddown', 13) + MB.fmt.pct(c.d) + '</div>'
              : c.note ? '<div class="sc-d c-3">' + MB.esc(c.note) + '</div>' : '') +
            (c.spark === false ? '' : '<div class="sc-spark"><span data-spark="' +
              (c.d >= 0 || c.d === undefined ? 'up' : 'down') + '" data-seed="' + MB.esc(c.k) +
              '" data-h="30" data-sw="2"></span></div>') + '</div>';
        }).join('') + '</div></div>';
    MB.mountIcons(el); MB.mountCharts(el);
    var track = MB.$('.statslider-track', el);
    MB.$$('[data-sl]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        track.scrollBy({ left: b.getAttribute('data-sl') === 'next' ? 460 : -460, behavior: 'smooth' });
      });
    });
    var sync = function () {
      var max = track.scrollWidth - track.clientWidth - 2;
      MB.$('[data-sl=prev]', el).disabled = track.scrollLeft <= 2;
      MB.$('[data-sl=next]', el).disabled = track.scrollLeft >= max;
    };
    track.addEventListener('scroll', sync); setTimeout(sync, 60);
  }
  function openSO(title, html) {
    document.getElementById('soTitle').textContent = title;
    document.getElementById('soBody').innerHTML = html;
    document.getElementById('slideover').classList.add('is-open');
    document.getElementById('soScrim').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    MB.mountIcons(document.getElementById('soBody'));
    MB.mountCharts(document.getElementById('soBody'));
  }
  function closeSO() {
    document.getElementById('slideover').classList.remove('is-open');
    document.getElementById('soScrim').classList.remove('is-open');
    document.body.style.overflow = '';
  }
  MB.ready(function () {
    var c = document.getElementById('soClose'), s = document.getElementById('soScrim');
    if (c) { c.addEventListener('click', closeSO); }
    if (s) { s.addEventListener('click', closeSO); }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSO(); } });
  });

MB.ready(function () {
  MB.api.get('admin/resources').then(function (res) {
    var rows = res.data, m = res.meta;

    statSlider('#stats', 'Library', [
      { k:'Resources', v: m.total, d: 6.4 },
      { k:'Paid', v: m.paid, tone:'accent', spark:false },
      { k:'Free', v: m.free, spark:false },
      { k:'Revenue', v: MB.fmt.money(m.revenue, null, 0), d: 18.6, tone:'accent' },
      { k:'Total enrolled', v: MB.fmt.compact(m.enrolled), d: 12.2 },
      { k:'Published', v: rows.filter(function (r) { return r.status === 'published'; }).length, spark:false },
      { k:'Drafts', v: rows.filter(function (r) { return r.status === 'draft'; }).length,
        tone:'warn', spark:false }
    ]);

    MB.datatable({
      data: rows, into: '#table', perPage: 15, selectable: true, sortKey: 'title',
      searchPlaceholder: 'Search resources…', search: ['title','type','level','author'],
      columns: [
        { key:'title', label:'Resource', sortable:true,
          render: function (r) {
            return '<a class="cell-link" href="resource-edit.html?id=' + r.id + '">' +
              '<div><div class="n">' + MB.esc(r.title) + '</div>' +
              '<div class="h c-3">' + MB.esc(r.summary) + '</div></div></a>'; } },
        { key:'type', label:'Type', sortable:true, filter:['course','pdf','video','webinar','mentorship'],
          render: function (r) { return '<span class="c-2">' + r.type + '</span>'; } },
        { key:'access', label:'Access', sortable:true, filter:['free','paid'],
          render: function (r) {
            return r.access === 'paid'
              ? '<span class="badge badge-info">' + MB.fmt.money(r.price) + '</span>'
              : '<span class="badge badge-active">Free</span>'; } },
        { key:'level', label:'Level', sortable:true, filter:['beginner','intermediate','advanced'],
          render: function (r) { return '<span class="badge badge-neutral">' + r.level + '</span>'; } },
        { key:'lessons', label:'Lessons', sortable:true, numeric:true },
        { key:'enrolled', label:'Enrolled', sortable:true, numeric:true,
          render: function (r) { return MB.fmt.compact(r.enrolled); } },
        { key:'revenue', label:'Revenue', sortable:true, numeric:true,
          render: function (r) { return r.revenue ? MB.fmt.money(r.revenue, null, 0)
            : '<span class="c-3">—</span>'; } },
        { key:'status', label:'Status', sortable:true, filter:['published','draft','scheduled','archived'],
          render: function (r) { return statusBadge(r.status); } },
        { key:'', label:'Actions', align:'right',
          render: function (r) { return acts(
            '<a class="row-action" href="resource-edit.html?id=' + r.id + '" aria-label="Edit">' +
              MB.icon('edit', 15) + '</a>'); } }
      ]
    });
  });
});
</script>
</body>
</html>
