<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resources — MarketBridge</title>
<meta name="theme-color" content="#0A0E12">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){try{var t=localStorage.getItem('mb.theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body data-shell="app" data-nav="home" data-root="../../" data-title="Resources" data-sub="Learn, grow and improve your trading" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>

  <main class="page">

    <div class="input-icon">
      <span data-icon="search"></span>
      <input class="input" id="resSearch" type="search" placeholder="Search resources…">
    </div>

    <div class="chips page-bleed" data-group id="resCat">
      <button class="chip is-active" data-value="all">All</button>
      <button class="chip" data-value="courses">Courses</button>
      <button class="chip" data-value="guides">Guides</button>
      <button class="chip" data-value="videos">Videos</button>
      <button class="chip" data-value="webinars">Webinars</button>
    </div>

    <section class="page-section">
      <div class="sec-head"><h2>Continue learning</h2></div>
      <div class="hscroll page-bleed" id="inProgress"></div>
    </section>

    <section class="page-section">
      <div class="sec-head"><h2 id="listTitle">All resources</h2></div>
      <div class="stack g3" id="resList"></div>
    </section>
  </main>

  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>
<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  MB.render({ into: '#inProgress', from: 'resources', skeleton: false,
    filter: function (r) { return r.progress_percent > 0; },
    template: MB.card.resource });

  var all = [], cat = 'all', q = '';
  function paint() {
    var rows = all.filter(function (r) {
      var okC = cat === 'all' || r.category === cat;
      var okQ = !q || (r.title + ' ' + r.summary).toLowerCase().indexOf(q) > -1;
      return okC && okQ;
    });
    var host = document.getElementById('resList');
    if (!rows.length) {
      host.innerHTML = '<div class="empty">' + MB.icon('book', 46) +
        '<h3>Nothing found</h3><p>Try another category.</p></div>';
      MB.mountIcons(host); return;
    }
    host.innerHTML = rows.map(function (r) {
      var isLive = r.is_live;
      return '<a class="list-row" style="border-radius:12px;border:1px solid var(--mb-border);' +
        'background:var(--mb-surface);margin-bottom:0" href="detail.html?slug=' + r.slug + '">' +
        '<span class="none" style="width:44px;height:44px;border-radius:8px;overflow:hidden;' +
        'background:var(--mb-surface-2)"><span data-chart="candle" data-seed="' + r.id +
        '" data-h="44" style="display:block"></span></span>' +
        '<span class="grow" style="min-width:0">' +
          '<span class="row g2"><span class="lr-title truncate">' + r.title + '</span>' +
          (isLive ? '<span class="badge badge-lost">Live</span>' : '') + '</span>' +
          '<span class="lr-sub truncate">' + r.summary + '</span>' +
          (r.progress_percent ? '<span class="progress mt2" style="display:block"><i style="width:' +
            r.progress_percent + '%"></i></span>' : '') +
        '</span>' +
        '<span class="none" style="text-align:right">' +
          '<span class="badge badge-neutral">' + r.level + '</span></span></a>';
    }).join('');
    MB.mountIcons(host); MB.mountCharts(host);
  }
  MB.api.list('resources').then(function (rows) { all = rows; paint(); });
  document.getElementById('resCat').addEventListener('mb:change', function (e) {
    cat = e.detail.value;
    document.getElementById('listTitle').textContent =
      cat === 'all' ? 'All resources' : cat.charAt(0).toUpperCase() + cat.slice(1);
    paint();
  });
  document.getElementById('resSearch').addEventListener('input', function () {
    q = this.value.trim().toLowerCase(); paint();
  });
});
</script>
</body>
</html>
