<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade History — MarketBridge</title>
<meta name="theme-color" content="#0A0E12">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<script>(function(){try{var t=localStorage.getItem('mb.theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
<body data-shell="app" data-nav="trade" data-root="../../" data-title="Trade History" data-sub="Every closed contract" data-back="index.html" data-unread="3">

<div class="app">
  <div data-render="topbar"></div>

  <main class="page">

    <div class="chips page-bleed" data-group id="hRange">
      <button class="chip is-active" data-value="today">Today</button>
      <button class="chip" data-value="7d">7 Days</button>
      <button class="chip" data-value="30d">30 Days</button>
      <button class="chip" data-value="all">All time</button>
    </div>

    <div class="stat-grid cols-3">
      <div class="stat-cell"><div class="stat-v num" id="hStake">$950</div><div class="stat-k">Staked</div></div>
      <div class="stat-cell"><div class="stat-v num c-up" id="hNet">+$99.60</div><div class="stat-k">Net P/L</div></div>
      <div class="stat-cell"><div class="stat-v num" id="hRate">71%</div><div class="stat-k">Win rate</div></div>
    </div>

    <section class="list" id="histList"></section>
  </main>

  <div data-render="tabbar"></div>
</div>

<script src="../../assets/js/core/icons.js"></script>
<script src="../../assets/js/core/util.js"></script>
<script src="../../assets/js/core/api.js"></script>
<script src="../../assets/js/core/collection.js"></script>
<script src="../../assets/js/core/charts.js"></script>
<script src="../../assets/js/core/ws.js"></script>
<script src="../../assets/js/components/cards.js"></script>
<script src="../../assets/js/core/shell.js"></script>
<script src="../../assets/js/core/pwa.js"></script>
<script>

MB.ready(function () {
  MB.api.list('history').then(function (rows) {
    var stake = rows.reduce(function (a, h) { return a + h.stake; }, 0);
    var net = rows.reduce(function (a, h) { return a + h.profit; }, 0);
    var wins = rows.filter(function (h) { return h.status === 'won'; }).length;
    document.getElementById('hStake').textContent = MB.fmt.money(stake, null, 0);
    var n = document.getElementById('hNet');
    n.textContent = MB.fmt.signed(net);
    n.className = 'stat-v num ' + MB.fmt.dirClass(net);
    document.getElementById('hRate').textContent = Math.round(wins / rows.length * 100) + '%';
  });
  MB.render({ into: '#histList', from: 'history', template: MB.card.historyRow,
    emptyIcon: 'clock', emptyTitle: 'No trades yet',
    emptyText: 'Closed contracts will be listed here.' });
});
</script>
</body>
</html>
